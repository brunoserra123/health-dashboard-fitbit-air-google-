<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Saúde | Fitbit</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #202024;
      --text-main: #e1e1e6;
      --text-muted: #a8a8b3;
      --accent-color: #00875f;
      --accent-hover: #04d361;
      --border-color: #323238;
      --heart-color: #f75a68;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    header {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
    }

    h1 { font-size: 1.5rem; }

    .btn {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn:hover { background-color: var(--accent-hover); }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    main {
      width: 100%;
      max-width: 800px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .card-value {
      font-size: 2.2rem;
      font-weight: 700;
    }

    .card-footer {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .val-steps { color: var(--accent-hover); }
    .val-heart { color: var(--heart-color); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1>Painel de Saúde</h1>
    <div>
      <button id="btn-login" class="btn">Conectar Conta Google</button>
      <button id="btn-logout" class="btn btn-secondary hidden">Sair</button>
    </div>
  </header>

  <main id="dashboard" class="hidden">
    <div class="card">
      <div class="card-title">Passos Hoje</div>
      <div class="card-value val-steps" id="metric-steps">--</div>
      <div class="card-footer" id="metric-steps-sub">A carregar...</div>
    </div>

    <div class="card">
      <div class="card-title">Calorias Gastas</div>
      <div class="card-value" id="metric-calories">--</div>
      <div class="card-footer">Estimativa diária</div>
    </div>

    <div class="card">
      <div class="card-title">Frequência Cardíaca</div>
      <div class="card-value val-heart" id="metric-heart">-- bpm</div>
      <div class="card-footer">Último registo</div>
    </div>
  </main>

  <script>
    const CLIENT_ID = '287121160905-2o87pjjueil1mc9ea2tut6i0mi7i0ljm.apps.googleusercontent.com';
    
    // Escopos explícitos para atividade e batimentos cardíacos
    const SCOPES = [
      'https://www.googleapis.com/auth/fitness.activity.read',
      'https://www.googleapis.com/auth/fitness.heart_rate.read',
      'https://www.googleapis.com/auth/fitness.body.read'
    ].join(' ');

    let tokenClient;
    let accessToken = localStorage.getItem('google_access_token');

    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    const dashboard = document.getElementById('dashboard');

    function initClient() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (resp) => {
          if (resp.access_token) {
            accessToken = resp.access_token;
            localStorage.setItem('google_access_token', accessToken);
            showDashboard();
            fetchData();
          }
        }
      });
    }

    window.onload = () => {
      initClient();
      if (accessToken) {
        showDashboard();
        fetchData();
      }
    };

    btnLogin.onclick = () => {
      // Força a janela de consentimento a reaparecer para aprovar os novos escopos
      tokenClient.requestAccessToken({ prompt: 'consent' });
    };

    btnLogout.onclick = () => {
      localStorage.removeItem('google_access_token');
      location.reload();
    };

    function showDashboard() {
      dashboard.classList.remove('hidden');
      btnLogin.classList.add('hidden');
      btnLogout.classList.remove('hidden');
    }

    async function fetchData() {
      const now = new Date();
      const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const endOfDay = now.getTime();

      try {
        const res = await fetch('https://www.googleapis.com/fitness/v1/users/me/dataset:aggregate', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            aggregateBy: [
              { dataTypeName: 'com.google.step_count.delta' },
              { dataTypeName: 'com.google.calories.expended' },
              { dataTypeName: 'com.google.heart_rate.bpm' }
            ],
            bucketByTime: { durationMillis: 86400000 },
            startTimeMillis: startOfDay,
            endTimeMillis: endOfDay
          })
        });

        if (res.status === 401 || res.status === 403) {
          localStorage.removeItem('google_access_token');
          btnLogin.classList.remove('hidden');
          btnLogout.classList.add('hidden');
          return;
        }

        const data = await res.json();
        
        if (data.bucket && data.bucket[0]) {
          const ds = data.bucket[0].dataset;

          // Passos
          let steps = 0;
          if (ds[0].point.length > 0) {
            steps = ds[0].point.reduce((acc, p) => acc + (p.value[0].intVal || 0), 0);
          }
          document.getElementById('metric-steps').innerText = steps.toLocaleString('pt-PT');
          document.getElementById('metric-steps-sub').innerText = `${Math.round((steps / 10000) * 100)}% da meta diária`;

          // Calorias
          let cals = 0;
          if (ds[1].point.length > 0) {
            cals = ds[1].point.reduce((acc, p) => acc + (p.value[0].fpVal || 0), 0);
          }
          document.getElementById('metric-calories').innerText = `${Math.round(cals)} kcal`;

          // Batimentos
          if (ds[2].point.length > 0) {
            const lastBpm = ds[2].point[ds[2].point.length - 1].value[0].fpVal;
            document.getElementById('metric-heart').innerText = `${Math.round(lastBpm)} bpm`;
          }
        }
      } catch (err) {
        console.error('Erro ao recolher dados:', err);
      }
    }
  </script>
</body>
</html>
