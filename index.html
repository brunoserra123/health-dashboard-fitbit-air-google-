<script>
    const CLIENT_ID = '287121160905-2o87pjjueil1mc9ea2tut6i0mi7i0ljm.apps.googleusercontent.com';
    
    const SCOPES = [
      'https://www.googleapis.com/auth/fitness.activity.read',
      'https://www.googleapis.com/auth/fitness.heart_rate.read',
      'https://www.googleapis.com/auth/fitness.sleep.read',
      'https://www.googleapis.com/auth/fitness.body.read',
      'https://www.googleapis.com/auth/fitness.location.read'
    ].join(' ');

    let tokenClient = null;
    let accessToken = localStorage.getItem('google_access_token');
    let autoRefreshTimer = null;

    const btnLogin = document.getElementById('btn-login');
    const btnLoginHero = document.getElementById('btn-login-hero');
    const btnLogout = document.getElementById('btn-logout');
    const loginBanner = document.getElementById('login-banner');
    const dashboard = document.getElementById('dashboard');
    const lastUpdated = document.getElementById('last-updated');

    function initClient() {
      if (typeof google !== 'undefined' && google.accounts && google.accounts.oauth2) {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPES,
          callback: (resp) => {
            if (resp.error) {
              console.error('Erro na autenticação:', resp);
              return;
            }
            if (resp.access_token) {
              accessToken = resp.access_token;
              localStorage.setItem('google_access_token', accessToken);
              showDashboard();
              fetchAllData();
              startAutoRefresh();
            }
          }
        });
        return true;
      }
      return false;
    }

    function handleAuth() {
      // Se ainda não estava inicializado, tenta inicializar no momento do clique
      if (!tokenClient) {
        initClient();
      }

      if (tokenClient) {
        tokenClient.requestAccessToken({ prompt: 'consent' });
      } else {
        alert('A carregar serviços da Google... Por favor, aguarde 2 segundos e tente novamente.');
      }
    }

    btnLogin.onclick = handleAuth;
    btnLoginHero.onclick = handleAuth;

    btnLogout.onclick = () => {
      stopAutoRefresh();
      localStorage.removeItem('google_access_token');
      location.reload();
    };

    window.onload = () => {
      // Tenta inicializar ou aguarda o script do Google estar pronto
      const checkGoogleInterval = setInterval(() => {
        if (initClient()) {
          clearInterval(checkGoogleInterval);
        }
      }, 300);

      if (accessToken) {
        showDashboard();
        fetchAllData();
        startAutoRefresh();
      }
    };

    function showDashboard() {
      loginBanner.classList.add('hidden');
      dashboard.classList.remove('hidden');
      btnLogin.classList.add('hidden');
      btnLogout.classList.remove('hidden');
      lastUpdated.classList.remove('hidden');
    }

    function startAutoRefresh() {
      stopAutoRefresh();
      autoRefreshTimer = setInterval(() => {
        fetchAllData();
      }, 10 * 60 * 1000);
    }

    function stopAutoRefresh() {
      if (autoRefreshTimer) {
        clearInterval(autoRefreshTimer);
        autoRefreshTimer = null;
      }
    }

    async function fetchAllData() {
      await Promise.all([fetchDailyMetrics(), fetchSleepData()]);
      const now = new Date();
      lastUpdated.innerText = `Atualizado às ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
    }

    async function fetchDailyMetrics() {
      const now = new Date();
      const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const endOfDay = now.getTime();

      try {
        const res = await fetch('https://www.googleapis.com/fitness/v1/users/me/dataset:aggregate', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            aggregateBy: [
              { dataTypeName: 'com.google.step_count.delta' },
              { dataTypeName: 'com.google.calories.expended' },
              { dataTypeName: 'com.google.heart_rate.bpm' },
              { dataTypeName: 'com.google.distance.delta' },
              { dataTypeName: 'com.google.active_minutes' }
            ],
            bucketByTime: { durationMillis: 86400000 },
            startTimeMillis: startOfDay,
            endTimeMillis: endOfDay
          })
        });

        if (res.status === 401 || res.status === 403) {
          localStorage.removeItem('google_access_token');
          stopAutoRefresh();
          location.reload();
          return;
        }

        const data = await res.json();
        
        if (data.bucket && data.bucket[0]) {
          const ds = data.bucket[0].dataset;

          let steps = 0;
          if (ds[0].point.length > 0) {
            steps = ds[0].point.reduce((acc, p) => acc + (p.value[0].intVal || 0), 0);
          }
          document.getElementById('metric-steps').innerText = steps.toLocaleString('pt-PT');
          document.getElementById('metric-steps-sub').innerText = `${Math.round((steps / 10000) * 100)}% da meta diária`;

          let cals = 0;
          if (ds[1].point.length > 0) {
            cals = ds[1].point.reduce((acc, p) => acc + (p.value[0].fpVal || 0), 0);
          }
          document.getElementById('metric-calories').innerText = `${Math.round(cals)} kcal`;

          if (ds[2].point.length > 0) {
            const lastBpm = ds[2].point[ds[2].point.length - 1].value[0].fpVal;
            document.getElementById('metric-heart').innerText = `${Math.round(lastBpm)} bpm`;
          }

          let meters = 0;
          if (ds[3].point.length > 0) {
            meters = ds[3].point.reduce((acc, p) => acc + (p.value[0].fpVal || 0), 0);
          }
          document.getElementById('metric-distance').innerText = `${(meters / 1000).toFixed(2)} km`;

          let activeMins = 0;
          if (ds[4].point.length > 0) {
            activeMins = ds[4].point.reduce((acc, p) => acc + (p.value[0].intVal || 0), 0);
          }
          document.getElementById('metric-active-time').innerText = `${activeMins} min`;
        }
      } catch (err) {
        console.error('Erro ao recolher métricas diárias:', err);
      }
    }

    async function fetchSleepData() {
      const now = new Date();
      const past36h = new Date(now.getTime() - (36 * 60 * 60 * 1000)).toISOString();
      const nowIso = now.toISOString();

      try {
        const res = await fetch(`https://www.googleapis.com/fitness/v1/users/me/sessions?startTime=${past36h}&endTime=${nowIso}&activityType=72`, {
          headers: { 'Authorization': `Bearer ${accessToken}` }
        });

        if (!res.ok) return;

        const data = await res.json();

        if (data.session && data.session.length > 0) {
          const sleep = data.session[data.session.length - 1];
          const startMs = parseInt(sleep.startTimeMillis);
          const endMs = parseInt(sleep.endTimeMillis);
          const totalMin = Math.floor((endMs - startMs) / 60000);

          document.getElementById('metric-sleep').innerText = `${Math.floor(totalMin / 60)}h ${totalMin % 60}m`;

          const dStart = new Date(startMs).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const dEnd
